pre-commit:
  parallel: true
  commands:
    oxlint:
      glob: "*.{ts,tsx,js,mjs}"
      run: |
        output=$(npx oxlint -c oxlint.json {staged_files} 2>&1)
        status=$?
        echo "$output"
        if [ $status -ne 0 ]; then exit $status; fi
        if echo "$output" | grep -qE 'Found [1-9][0-9]* warning'; then exit 1; fi
    typecheck:
      run: npm run typecheck
    cspell:
      glob: "*.{ts,tsx,js,mjs,md,json}"
      run: npx cspell --no-progress --no-must-find-files {staged_files}

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: npm run typecheck
    unit-tests:
      run: npm run test:unit
