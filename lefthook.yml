pre-commit:
  parallel: true
  commands:
    oxlint:
      glob: "*.{ts,tsx,js,mjs}"
      run: |
        [ "$ANQR_AUTOMATION_COMMIT" = "1" ] && exit 0
        output=$(npx oxlint -c oxlint.json {staged_files} 2>&1)
        status=$?
        echo "$output"
        if [ $status -ne 0 ]; then exit $status; fi
        if echo "$output" | grep -qE 'Found [1-9][0-9]* warning'; then exit 1; fi
    typecheck:
      run: |
        [ "$ANQR_AUTOMATION_COMMIT" = "1" ] && exit 0
        npm run typecheck
    cspell:
      glob: "*.{ts,tsx,js,mjs,md,json}"
      run: |
        [ "$ANQR_AUTOMATION_COMMIT" = "1" ] && exit 0
        npx cspell --no-progress --no-must-find-files {staged_files}
    ast-density:
      glob: "*.{ts,tsx}"
      run: |
        [ "$ANQR_AUTOMATION_COMMIT" = "1" ] && exit 0
        output=$(node scripts/audit-ast-density.mjs --threshold 1 {staged_files} 2>&1)
        if [ -n "$output" ]; then
          echo "$output"
          echo "AST density violation: files have more than 1 top-level declaration"
          # exit 1
        fi

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: |
        [ "$ANQR_AUTOMATION_PUSH" = "1" ] && exit 0
        npm run typecheck

