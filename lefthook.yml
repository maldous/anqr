pre-commit:
  parallel: true
  commands:
    oxlint:
      glob: "*.{ts,tsx,js,mjs}"
      run: npx oxlint -c oxlint.json {staged_files}
    typecheck:
      run: npm run typecheck
    cspell:
      glob: "*.{ts,tsx,js,mjs,md,json}"
      run: npx cspell --no-progress --no-must-find-files {staged_files}

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: npm run typecheck
    unit-tests:
      run: npm run test:unit
