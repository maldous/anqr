pre-commit:
  parallel: true
  commands:
    oxlint:
      glob: "*.{ts,tsx,js,mjs}"
      run: |
        [ "$ANQR_AUTOMATION_COMMIT" = "1" ] && exit 0
        output=$(npx oxlint -c oxlint.json {staged_files} 2>&1)
        status=$?
        echo "$output"
        if [ $status -ne 0 ]; then exit $status; fi
        if echo "$output" | grep -qE 'Found [1-9][0-9]* warning'; then exit 1; fi
    # `npm run typecheck` alone runs against the root tsconfig, which
    # includes only the ~empty src/ tree — toothless. Run the per-project
    # configurations directly so apps/, packages/, netlify/ and harness/
    # all get typechecked. typecheck:tests still has 67 known errors
    # (mostly TS18047 non-null narrowing in unit specs) — kept out of the
    # gate until those land in a follow-up.
    typecheck:
      run: |
        [ "$ANQR_AUTOMATION_COMMIT" = "1" ] && exit 0
        npm run typecheck:src \
          && npm run typecheck:apps \
          && npm run typecheck:packages \
          && npm run typecheck:netlify \
          && npm run typecheck:harness
    ast-density:
      glob: "*.{ts,tsx}"
      run: |
        [ "$ANQR_AUTOMATION_COMMIT" = "1" ] && exit 0
        output=$(node harness/audit-ast-density.mjs --threshold 1 {staged_files} 2>&1)
        if [ -n "$output" ]; then
          echo "$output"
          echo "AST density violation: files have more than 1 top-level declaration"
          # exit 1
        fi

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: |
        [ "$ANQR_AUTOMATION_PUSH" = "1" ] && exit 0
        npm run typecheck:src \
          && npm run typecheck:apps \
          && npm run typecheck:packages \
          && npm run typecheck:netlify \
          && npm run typecheck:harness

