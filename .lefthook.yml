# Lefthook git hooks configuration
# Install hooks: npx lefthook install

pre-commit:
  parallel: true
  commands:
    lint-staged:
      glob: '*.{ts,tsx,js,jsx,json}'
      run: npx lint-staged
    typecheck:
      run: npx tsc --noEmit

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}
