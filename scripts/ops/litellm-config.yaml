# LiteLLM Proxy Configuration for Symphony
# Translates OpenAI Responses API → provider Chat Completions
# with proper structured tool_calls support.
#
# Start: litellm --config scripts/ops/litellm-config.yaml --port 4010
# Codex talks to http://localhost:4010 as an OpenAI-compatible endpoint.

model_list:
  # --- Cloud models (routed through LiteLLM for Responses API translation) ---
  - model_name: groq-llama-70b
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_TOKEN
      additional_drop_params: ["web_search_options", "supports_function_calling"]

  # Gemini uses native gemini/ prefix so LiteLLM's /v1/responses handler
  # can route requests correctly. The earlier openai/ prefix workaround
  # (for convert_to_gemini_tool_call_result bugs on /v1/chat/completions)
  # broke /v1/responses with 404. Codex uses /v1/responses exclusively,
  # which is a separate LiteLLM code path that handles Gemini natively.
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_TOKEN
      additional_drop_params: ["web_search_options", "supports_function_calling"]

  - model_name: gemini-flash-lite
    litellm_params:
      model: gemini/gemini-2.5-flash-lite
      api_key: os.environ/GEMINI_TOKEN
      additional_drop_params: ["web_search_options", "supports_function_calling"]

  - model_name: cerebras-llama-8b
    litellm_params:
      model: cerebras/llama3.1-8b
      api_key: os.environ/CEREBRAS_TOKEN
      additional_drop_params: ["web_search_options", "supports_function_calling"]

  - model_name: openrouter-free
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct:free
      api_key: os.environ/OPENROUTER_TOKEN
      additional_drop_params: ["web_search_options", "supports_function_calling"]

  - model_name: sambanova-llama-70b
    litellm_params:
      model: sambanova/Meta-Llama-3.3-70B-Instruct
      api_key: os.environ/SAMBANOVA_TOKEN
      additional_drop_params: ["web_search_options", "supports_function_calling"]

  - model_name: mistral-codestral
    litellm_params:
      model: mistral/devstral-small-2507
      api_key: os.environ/MISTRAL_TOKEN
      additional_drop_params: ["web_search_options", "supports_function_calling"]

  - model_name: mistral-small
    litellm_params:
      model: mistral/mistral-small-latest
      api_key: os.environ/MISTRAL_TOKEN
      additional_drop_params: ["web_search_options", "supports_function_calling"]

  # --- Local Ollama model (single optimised model for i9-13900K + 4GB VRAM) ---
  - model_name: qwen2.5-coder-7b-32t
    litellm_params:
      model: ollama/qwen2.5-coder:7b-32t
      api_base: http://localhost:11434
      num_ctx: 32768

general_settings:
  default_model: qwen2.5-coder-7b-32t

litellm_settings:
  drop_params: true
  set_verbose: false
  num_retries: 0
