functionsDirectory = "/home/user/src/anqr/netlify/functions"
functionsDirectoryOrigin = "config-v1"
headersOrigin = "config"
redirectsOrigin = "config"
plugins = []

[build]
publish = "/home/user/src/anqr/dist"
publishOrigin = "config"
commandOrigin = "config"
command = "npm run build"
functions = "/home/user/src/anqr/netlify/functions"

[build.environment]

[build.processing]

[build.processing.css]

[build.processing.html]

[build.processing.images]

[build.processing.js]

[build.services]

[functions]

[functions."*"]
node_bundler = "esbuild"

[[headers]]
for = "/"

[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/index.html"

[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/gallery/*"

[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/*.png"

[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/*.ico"

[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/*.svg"

[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "/manifest.json"

[headers.values]
Cache-Control = "public, max-age=3600"

[[headers]]
for = "/*"

[headers.values]
Cache-Control = "no-cache"

[[redirects]]
from = "/api/qr"
to = "/.netlify/functions/qr"
status = 200.0
force = true

