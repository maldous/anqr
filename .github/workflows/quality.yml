name: Quality Checks

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --include=optional

      - name: Lint + Format Check
        run: |
          npx oxlint --deny-warnings --tsconfig ./tsconfig.json .
          npx oxfmt .
          npx oxfmt --check .

      - name: Typecheck
        run: npm run typecheck

      - name: Share Param Parity Guardrail
        run: npm run check:parity
      - name: i18n Regression Guard
        run: npm run test:i18n

      - name: Performance Budget Guard
        run: npm run test:perf:budget
      - name: Reliability Gate
        run: npm run ci:reliability-gate

  ops-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Check Node.js scripts
        run: find scripts/ops -name '*.mjs' -exec node --check {} +

      - name: Check shell scripts
        run: find scripts/ops -name '*.sh' -exec bash -n {} +

      - name: Check Python scripts
        run: |
          for f in $(find scripts/ops -name '*.py'); do
            python3 -c "import py_compile; py_compile.compile('$f', doraise=True)"
          done
