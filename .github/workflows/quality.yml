name: Quality Checks

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --force

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test:unit:ci

      - name: i18n Regression Guard
        run: npm run test:i18n
