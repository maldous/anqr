name: Quality Checks

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_ADSENSE_PUBLISHER_ID: ${{ secrets.VITE_ADSENSE_PUBLISHER_ID }}
      VITE_ADSENSE_SLOT_LEFT_SKYSCRAPER: ${{ secrets.VITE_ADSENSE_SLOT_LEFT_SKYSCRAPER }}
      VITE_ADSENSE_SLOT_RIGHT_SKYSCRAPER: ${{ secrets.VITE_ADSENSE_SLOT_RIGHT_SKYSCRAPER }}
      VITE_ADSENSE_SLOT_SIDEBAR_BOTTOM: ${{ secrets.VITE_ADSENSE_SLOT_SIDEBAR_BOTTOM }}
      VITE_ADSENSE_SLOT_GALLERY_LEFT: ${{ secrets.VITE_ADSENSE_SLOT_GALLERY_LEFT }}
      VITE_ADSENSE_SLOT_GALLERY_RIGHT: ${{ secrets.VITE_ADSENSE_SLOT_GALLERY_RIGHT }}
      VITE_ADSENSE_SLOT_GALLERY_TOP: ${{ secrets.VITE_ADSENSE_SLOT_GALLERY_TOP }}
      VITE_ADSENSE_SLOT_GALLERY_BOTTOM: ${{ secrets.VITE_ADSENSE_SLOT_GALLERY_BOTTOM }}
      VITE_ADSENSE_SLOT_STATIC_LEFT: ${{ secrets.VITE_ADSENSE_SLOT_STATIC_LEFT }}
      VITE_ADSENSE_SLOT_STATIC_RIGHT: ${{ secrets.VITE_ADSENSE_SLOT_STATIC_RIGHT }}
      VITE_ADSENSE_SLOT_GUIDE_TOP: ${{ secrets.VITE_ADSENSE_SLOT_GUIDE_TOP }}
      VITE_ADSENSE_SLOT_GUIDE_BOTTOM: ${{ secrets.VITE_ADSENSE_SLOT_GUIDE_BOTTOM }}
      VITE_ADSENSE_SLOT_LEARN_TOP: ${{ secrets.VITE_ADSENSE_SLOT_LEARN_TOP }}
      VITE_ADSENSE_SLOT_LEARN_BOTTOM: ${{ secrets.VITE_ADSENSE_SLOT_LEARN_BOTTOM }}
      VITE_ADSENSE_SLOT_EXAMPLES_TOP: ${{ secrets.VITE_ADSENSE_SLOT_EXAMPLES_TOP }}
      VITE_ADSENSE_SLOT_EXAMPLES_BOTTOM: ${{ secrets.VITE_ADSENSE_SLOT_EXAMPLES_BOTTOM }}
      VITE_ADSENSE_SLOT_ABOUT_TOP: ${{ secrets.VITE_ADSENSE_SLOT_ABOUT_TOP }}
      VITE_ADSENSE_SLOT_ABOUT_BOTTOM: ${{ secrets.VITE_ADSENSE_SLOT_ABOUT_BOTTOM }}
      VITE_ADSENSE_SLOT_PRIVACY_TOP: ${{ secrets.VITE_ADSENSE_SLOT_PRIVACY_TOP }}
      VITE_ADSENSE_SLOT_PRIVACY_BOTTOM: ${{ secrets.VITE_ADSENSE_SLOT_PRIVACY_BOTTOM }}
      VITE_ADSENSE_SLOT_TERMS_TOP: ${{ secrets.VITE_ADSENSE_SLOT_TERMS_TOP }}
      VITE_ADSENSE_SLOT_TERMS_BOTTOM: ${{ secrets.VITE_ADSENSE_SLOT_TERMS_BOTTOM }}
      VITE_ADSENSE_SLOT_CONTACT_TOP: ${{ secrets.VITE_ADSENSE_SLOT_CONTACT_TOP }}
      VITE_ADSENSE_SLOT_CONTACT_BOTTOM: ${{ secrets.VITE_ADSENSE_SLOT_CONTACT_BOTTOM }}
      VITE_ADSENSE_SLOT_TRANSLATE_TOP: ${{ secrets.VITE_ADSENSE_SLOT_TRANSLATE_TOP }}
      VITE_ADSENSE_SLOT_TRANSLATE_BOTTOM: ${{ secrets.VITE_ADSENSE_SLOT_TRANSLATE_BOTTOM }}
      VITE_ADSENSE_SLOT_GALLERY_AFTER_PLAIN: ${{ secrets.VITE_ADSENSE_SLOT_GALLERY_AFTER_PLAIN }}
      VITE_ADSENSE_SLOT_GALLERY_AFTER_CONTENT_TYPES: ${{ secrets.VITE_ADSENSE_SLOT_GALLERY_AFTER_CONTENT_TYPES }}
      VITE_ADSENSE_SLOT_GALLERY_AFTER_STYLES: ${{ secrets.VITE_ADSENSE_SLOT_GALLERY_AFTER_STYLES }}
      VITE_ADSENSE_SLOT_GALLERY_AFTER_COLORS: ${{ secrets.VITE_ADSENSE_SLOT_GALLERY_AFTER_COLORS }}
      VITE_ADSENSE_SLOT_GALLERY_AFTER_IMAGE_OVERLAY: ${{ secrets.VITE_ADSENSE_SLOT_GALLERY_AFTER_IMAGE_OVERLAY }}
      VITE_ADSENSE_SLOT_GALLERY_AFTER_ANIMATION_OVERLAY: ${{ secrets.VITE_ADSENSE_SLOT_GALLERY_AFTER_ANIMATION_OVERLAY }}
      VITE_ADSENSE_SLOT_GALLERY_AFTER_BLEND_MODES: ${{ secrets.VITE_ADSENSE_SLOT_GALLERY_AFTER_BLEND_MODES }}
      VITE_ADSENSE_SLOT_GALLERY_AFTER_COLOR_MODES: ${{ secrets.VITE_ADSENSE_SLOT_GALLERY_AFTER_COLOR_MODES }}
      VITE_ADSENSE_SLOT_GALLERY_AFTER_PREPROCESSING: ${{ secrets.VITE_ADSENSE_SLOT_GALLERY_AFTER_PREPROCESSING }}
      VITE_ADSENSE_SLOT_GALLERY_AFTER_ENCODING: ${{ secrets.VITE_ADSENSE_SLOT_GALLERY_AFTER_ENCODING }}
      VITE_ADSENSE_SLOT_GALLERY_AFTER_DITHERING: ${{ secrets.VITE_ADSENSE_SLOT_GALLERY_AFTER_DITHERING }}
      VITE_ADSENSE_SLOT_GALLERY_AFTER_POWER_COMBOS: ${{ secrets.VITE_ADSENSE_SLOT_GALLERY_AFTER_POWER_COMBOS }}
      VITE_ADSENSE_SLOT_GALLERY_AFTER_QR_ART: ${{ secrets.VITE_ADSENSE_SLOT_GALLERY_AFTER_QR_ART }}
      VITE_ADMOB_APP_ID: ${{ secrets.VITE_ADMOB_APP_ID }}
      VITE_ADMOB_IOS_APP_ID: ${{ secrets.VITE_ADMOB_IOS_APP_ID }}
      VITE_ADMOB_BANNER_BOTTOM: ${{ secrets.VITE_ADMOB_BANNER_BOTTOM }}
      VITE_ADMOB_BANNER_TOP: ${{ secrets.VITE_ADMOB_BANNER_TOP }}
      VITE_ADMOB_INTERSTITIAL_EXPORT: ${{ secrets.VITE_ADMOB_INTERSTITIAL_EXPORT }}
      VITE_ADMOB_INTERSTITIAL_GALLERY: ${{ secrets.VITE_ADMOB_INTERSTITIAL_GALLERY }}
      VITE_ADMOB_INTERSTITIAL_GENERATION: ${{ secrets.VITE_ADMOB_INTERSTITIAL_GENERATION }}
      VITE_ADMOB_REWARDED_PREMIUM: ${{ secrets.VITE_ADMOB_REWARDED_PREMIUM }}
      VITE_ADMOB_REWARDED_EXPORT_HD: ${{ secrets.VITE_ADMOB_REWARDED_EXPORT_HD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --include=optional

      - name: Lint + Format Check
        run: |
          npx oxlint --deny-warnings --tsconfig ./tsconfig.json .
          npx oxfmt .
          npx oxfmt --check .

      - name: Typecheck
        run: npm run typecheck

      - name: Share Param Parity Guardrail
        run: npm run check:parity
      - name: i18n Regression Guard
        run: npm run test:i18n

      - name: Performance Budget Guard
        run: npm run test:perf:budget
      - name: Reliability Gate
        run: npm run ci:reliability-gate

  ops-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Check Node.js scripts
        run: find scripts/ops -name '*.mjs' -exec node --check {} +

      - name: Check shell scripts
        run: find scripts/ops -name '*.sh' -exec bash -n {} +

      - name: Check Python scripts
        run: |
          for f in $(find scripts/ops -name '*.py'); do
            python3 -c "import py_compile; py_compile.compile('$f', doraise=True)"
          done
