name: Quality Checks

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALLOW_PAID_ACTIONS: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --omit=optional

      - name: Enforce no-cost default pipeline policy
        run: |
          set -euo pipefail
          PLAN="$(make -n all)"
          if echo "$PLAN" | grep -E "make deploy|netlify deploy --prod|make indexnow|submit-indexnow|upload-to-play-store.py|make i18n:push"; then
            echo "No-cost policy violation: make all includes paid/external-release actions."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests
        run: npm run test:unit:ci

      - name: i18n Regression Guard
        run: npm run test:i18n
