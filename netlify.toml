[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ============================================
# Cache Headers
# ============================================

# index.html - Always fetch fresh (enables instant deploys)
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Hashed assets from Vite build - cache forever (hash changes on content change)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static files in public folder - moderate caching
[[headers]]
  for = "/gallery/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Default - no cache for unmatched paths (SPA routes like /gallery, /about)
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"

# ============================================
# Redirects
# ============================================

# API redirect - must come BEFORE the SPA catch-all
[[redirects]]
  from = "/api/qr"
  to = "/.netlify/functions/qr"
  status = 200

# Legacy endpoint - redirect to new path for backward compatibility
[[redirects]]
  from = "/api/qr.png"
  to = "/api/qr"
  status = 301

# SPA catch-all for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
