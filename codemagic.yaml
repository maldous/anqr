# CodeMagic CI for ANQR iOS (Capacitor → TestFlight)
#
# Triggers on every push to `main`. Free tier covers ~10× of these per month.
#
# One-time setup in the CodeMagic web UI (see codemagic/SETUP.md):
#   1. Add App Store Connect integration (paste the .p8 key from bootstrap.zip)
#   2. Create a "TestFlight" beta group in App Store Connect that matches
#      `beta_groups` below
#
# After that: every `git push origin main` triggers a build that ends up on
# the ANQR TestFlight internal track.

workflows:
  ios-testflight:
    name: ANQR iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      # NOTE: deliberately NOT using `ios_signing:` block here.
      # That block expects manually-uploaded .p12 + .mobileprovision in the
      # CodeMagic UI. We instead use the App Store Connect integration to
      # fetch (or auto-create) signing assets in the "Fetch or create signing
      # assets" script step below — fewer manual UI clicks.
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "link.anqr.app"
        APP_STORE_APPLE_ID: "6760246476"
        APPLE_TEAM_ID: "5NXZ72D7LF"
      node: "22"
      xcode: latest
      # No cocoapods — this Capacitor 8 project uses Swift Package Manager
      # only (ios/App/CapApp-SPM/Package.swift). xcodebuild resolves SPM
      # dependencies automatically during archive.

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    integrations:
      app_store_connect: AppStoreConnect_anqr

    scripts:
      - name: Install npm dependencies
        script: |
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build the Vite web bundle
        script: |
          export VITE_SENTRY_RELEASE="anqr@${CM_BUILD_NUMBER:-local}"
          npm run build:web

      - name: Capacitor sync to iOS
        script: |
          npx cap sync ios
          find ios/App/App/public -name '*.gz' -delete || true

      - name: Initialise keychain
        script: |
          keychain initialize

      - name: Bump iOS build number
        script: |
          cd ios/App
          NEXT_BUILD=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID") + 1))
          agvtool new-version -all "$NEXT_BUILD"

      - name: Build the .ipa
        script: |
          set -e
          # Call xcodebuild directly — `xcode-project build-ipa` forces
          # CODE_SIGN_STYLE=Manual which defeats -allowProvisioningUpdates.
          # We want AUTOMATIC signing with App Store Connect API key auth so
          # Xcode fetches/creates the profile inline.
          ARCHIVE_PATH="$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive"
          IPA_PATH="$CM_BUILD_DIR/build/ios/ipa"
          KEY_PATH="$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"

          mkdir -p "$HOME/private_keys"

          # Diagnostic: print all ASC-related env vars (size + safe fingerprint)
          # and search common Codemagic locations for an existing .p8 file.
          echo "=== ASC env var diagnostics ==="
          for v in APP_STORE_CONNECT_PRIVATE_KEY APP_STORE_CONNECT_KEY_CONTENT \
                   APP_STORE_CONNECT_KEY_KEY APP_STORE_CONNECT_API_KEY_CONTENT \
                   ASC_PRIVATE_KEY APP_STORE_CONNECT_API_KEY APP_STORE_CONNECT_KEY \
                   APP_STORE_CONNECT_API_KEY_PATH; do
            val="${!v:-}"
            if [ -n "$val" ]; then
              echo "  $v: ${#val} chars; head: ${val:0:8}…${val: -8}"
            fi
          done
          echo "All ASC/APPLE-related env var NAMES (no values):"
          env | grep -iE "^(APP_STORE|APPLE|ASC|FASTLANE|XCODE|CODEMAGIC)" | cut -d= -f1 | sort
          echo ""
          echo "=== Searching for any *.p8 file on the build machine ==="
          find "$HOME" "$CM_BUILD_DIR" /tmp /Users -name "*.p8" -type f 2>/dev/null | head -20
          find "$HOME/private_keys" "$HOME/Library/MobileDevice" -type f 2>/dev/null | head -20
          echo "==============================================="

          # Resolve the ASC private key. CodeMagic stores integration-managed
          # keys as a file reference (`@file:/path/to/AuthKey_XYZ.p8`); direct
          # env vars contain the raw PEM. Handle both.
          python3 - "$KEY_PATH" <<'PY'
          import os, sys, shutil
          path = sys.argv[1]
          raw = (
              os.environ.get("APP_STORE_CONNECT_PRIVATE_KEY")
              or os.environ.get("APP_STORE_CONNECT_KEY_CONTENT")
              or ""
          ).strip()
          if not raw:
              print("ERROR: no ASC private key in env", file=sys.stderr)
              sys.exit(1)

          # Case 1: CodeMagic integration file reference.
          if raw.startswith("@file:"):
              src = raw[len("@file:"):]
              if not os.path.isfile(src):
                  print(f"ERROR: @file reference points to missing path: {src}", file=sys.stderr)
                  sys.exit(2)
              shutil.copyfile(src, path)
              os.chmod(path, 0o600)
              print(f"Copied {os.path.getsize(path)} bytes from {src} → {path}")
              sys.exit(0)

          # Case 2: raw PEM content in env var.
          if "BEGIN" in raw:
              with open(path, "w") as f:
                  f.write(raw.rstrip() + "\n")
              os.chmod(path, 0o600)
              print(f"Wrote {os.path.getsize(path)} bytes (raw PEM env)")
              sys.exit(0)

          # Case 3: base64-encoded PEM.
          import base64
          try:
              decoded = base64.b64decode(raw + "==").decode("ascii")
              if "BEGIN" in decoded:
                  with open(path, "w") as f:
                      f.write(decoded.rstrip() + "\n")
                  os.chmod(path, 0o600)
                  print(f"Wrote {os.path.getsize(path)} bytes (base64-decoded PEM)")
                  sys.exit(0)
          except Exception as e:
              print(f"ERROR: env var ({len(raw)} chars) is neither @file ref, PEM, nor base64: {e}", file=sys.stderr)
              sys.exit(3)
          print(f"ERROR: env var ({len(raw)} chars) format not recognised", file=sys.stderr)
          sys.exit(4)
          PY
          ls -la "$KEY_PATH"
          echo "First line: $(head -1 "$KEY_PATH")"

          mkdir -p "$IPA_PATH"

          # Use CodeMagic CLI tools to fetch+install signing assets via the
          # ASC API key, then build with Manual signing referencing the
          # fetched provisioning profile. Manual (not Automatic) because:
          #   * CODE_SIGN_STYLE=Automatic forbids pinning CODE_SIGN_IDENTITY
          #     ("conflicting provisioning settings" error).
          #   * Without pinning, Xcode honors the project's baked-in
          #     "iPhone Developer" Release identity and looks for a dev
          #     profile — which doesn't exist for App Store distribution.
          # `xcode-project use-profiles` patches the .xcodeproj to point
          # at the fetched .mobileprovision so Manual signing works.
          #
          # CERT KEY MUST BE PERSISTENT across builds. Earlier versions
          # generated a fresh keypair every build, which caused Apple to
          # email "your certificate was revoked" on every run (the previous
          # build's cert was unreachable, then we deleted it). The fix:
          # store the cert PEM in the CodeMagic env var CERT_PRIVATE_KEY_PEM
          # (group: ios_signing, encrypted). Same key every build → cert
          # gets created once and reused thereafter. No delete-create churn.
          #
          # @file: prefix is CodeMagic's convention when the env var is
          # registered as a "file" type. Handle both forms.
          # Cert private key: prefer the persistent CERT_PRIVATE_KEY_PEM env
          # var (set once in CodeMagic UI) so the same cert is reused build
          # to build. If that env var is missing we fall back to the
          # round-10 ephemeral path (generate fresh + delete prior orphan
          # certs) — that path works but emails the team "your certificate
          # was revoked" on every run.
          CERT_KEY_PATH="$HOME/build_cert_key.pem"
          USING_PERSISTENT_KEY=0
          if [ -n "${CERT_PRIVATE_KEY_PEM:-}" ]; then
            echo "=== Using persistent CERT_PRIVATE_KEY_PEM from env ==="
            python3 - "$CERT_KEY_PATH" <<'PY'
          import os, sys, shutil
          path = sys.argv[1]
          raw = (os.environ.get("CERT_PRIVATE_KEY_PEM") or "").strip()
          if raw.startswith("@file:"):
              shutil.copyfile(raw[len("@file:"):], path)
          else:
              with open(path, "w") as f:
                  f.write(raw.rstrip() + "\n")
          os.chmod(path, 0o600)
          print(f"Wrote {os.path.getsize(path)} bytes to {path}")
          PY
            USING_PERSISTENT_KEY=1
          else
            echo "=== CERT_PRIVATE_KEY_PEM not set → falling back to per-build keypair ==="
            echo "  (this works but Apple will email 'certificate revoked' each run)"
            openssl genrsa -out "$CERT_KEY_PATH" 2048
            chmod 600 "$CERT_KEY_PATH"
          fi
          ls -la "$CERT_KEY_PATH"
          echo "First line: $(head -1 "$CERT_KEY_PATH")"

          # When using the ephemeral fallback we must delete prior
          # distribution certs first so --create doesn't hit Apple's
          # "current Distribution certificate or pending request" 409.
          # When using the persistent key, the matching cert (created on
          # first run with this key) is reused and we skip the delete to
          # avoid the revoke-email churn.
          if [ "$USING_PERSISTENT_KEY" -eq 0 ]; then
            : > /tmp/asc-cert-ids.txt
            for cert_type in DISTRIBUTION IOS_DISTRIBUTION; do
              app-store-connect --silent --no-color certificates list \
                --type "$cert_type" --json \
                > "/tmp/asc-certs-$cert_type.json" 2>&1 || true
              python3 - "/tmp/asc-certs-$cert_type.json" >> /tmp/asc-cert-ids.txt <<'PY'
          import json, re, sys
          path = sys.argv[1]
          try:
              raw = open(path).read()
              raw = re.sub(r"\x1b\[[0-9;]*[a-zA-Z]", "", raw)
              lines = raw.split("\n")
              start = next(
                  (i for i, line in enumerate(lines) if line.lstrip().startswith(("[", "{"))),
                  -1,
              )
              if start < 0:
                  sys.exit(0)
              data = json.loads("\n".join(lines[start:]))
              certs = data if isinstance(data, list) else data.get("data", [])
              for c in certs:
                  cid = c.get("id") if isinstance(c, dict) else None
                  if cid:
                      print(cid)
          except Exception as exc:
              print(f"(parse error: {exc})", file=sys.stderr)
          PY
            done
            sort -u /tmp/asc-cert-ids.txt > /tmp/asc-cert-ids.unique
            mv /tmp/asc-cert-ids.unique /tmp/asc-cert-ids.txt
            echo "=== Certs to delete (ephemeral-key path) ==="
            cat /tmp/asc-cert-ids.txt
            while read cid; do
              [ -z "$cid" ] && continue
              app-store-connect certificates delete "$cid" --ignore-not-found 2>&1 \
                || echo "  (delete $cid failed; continuing)"
            done < /tmp/asc-cert-ids.txt
          fi

          # fetch-signing-files: with the persistent key, this either
          # downloads the existing matching cert OR creates it once on
          # the first run. With the ephemeral key, it always creates.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key="@file:$CERT_KEY_PATH"
          keychain add-certificates

          # `xcode-project use-profiles` can ALSO emit a ready-to-use
          # exportOptions.plist with manual signingStyle + the freshly-
          # fetched profile name in `provisioningProfiles`. That's what we
          # need: round 9 succeeded at archive (Manual signing, profile
          # installed) but the export step failed with "No profiles for
          # 'link.anqr.app'" because the hand-written plist said
          # signingStyle: automatic and Xcode couldn't auto-discover the
          # profile during export. Letting use-profiles generate the plist
          # keeps archive + export in sync.
          xcode-project use-profiles \
            --export-options-plist "$CM_BUILD_DIR/build/ios/exportOptions.plist" \
            --custom-export-options '{"stripSwiftSymbols": true, "uploadSymbols": true}'
          echo "=== Generated exportOptions.plist ==="
          cat "$CM_BUILD_DIR/build/ios/exportOptions.plist"
          echo "==="

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            COMPILER_INDEX_STORE_ENABLE=NO

          # Manual export against the generated plist. -allowProvisioningUpdates
          # + ASC API key intentionally OMITTED here: with a manual-style plist
          # they trigger the "Cloud signing permission error" path round 9 hit.
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$IPA_PATH" \
            -exportOptionsPlist "$CM_BUILD_DIR/build/ios/exportOptions.plist"

    artifacts:
      - "$CM_BUILD_DIR/build/ios/ipa/*.ipa"
      - "/tmp/xcodebuild_logs/*.log"
      - "$HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app.dSYM.zip"

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # NO beta_groups: the "ANQR" group in App Store Connect is INTERNAL
        # (App Store Connect Users). Apple's API refuses to add builds to
        # internal groups ("Builds cannot be assigned to this internal
        # group"); internal testers auto-receive new builds once processing
        # completes. Add an external group here only when one exists.
        expire_build_submitted_for_review: true
