# CodeMagic CI for ANQR iOS (Capacitor → TestFlight)
#
# Triggers on every push to `main`. Free tier covers ~10× of these per month.
#
# One-time setup in the CodeMagic web UI (see codemagic/SETUP.md):
#   1. Add App Store Connect integration (paste the .p8 key from bootstrap.zip)
#   2. Create a "TestFlight" beta group in App Store Connect that matches
#      `beta_groups` below
#
# After that: every `git push origin main` triggers a build that ends up on
# the ANQR TestFlight internal track.

workflows:
  ios-testflight:
    name: ANQR iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      # NOTE: deliberately NOT using `ios_signing:` block here.
      # That block expects manually-uploaded .p12 + .mobileprovision in the
      # CodeMagic UI. We instead use the App Store Connect integration to
      # fetch (or auto-create) signing assets in the "Fetch or create signing
      # assets" script step below — fewer manual UI clicks.
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "link.anqr.app"
        APP_STORE_APPLE_ID: "6760246476"
        APPLE_TEAM_ID: "5NXZ72D7LF"
      node: "22"
      xcode: latest
      # No cocoapods — this Capacitor 8 project uses Swift Package Manager
      # only (ios/App/CapApp-SPM/Package.swift). xcodebuild resolves SPM
      # dependencies automatically during archive.

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    integrations:
      app_store_connect: AppStoreConnect_anqr

    scripts:
      - name: Install npm dependencies
        script: |
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build the Vite web bundle
        script: |
          export VITE_SENTRY_RELEASE="anqr@${CM_BUILD_NUMBER:-local}"
          npm run build:web

      - name: Capacitor sync to iOS
        script: |
          npx cap sync ios
          find ios/App/App/public -name '*.gz' -delete || true

      - name: Initialise keychain
        script: |
          keychain initialize

      - name: Bump iOS build number
        script: |
          cd ios/App
          NEXT_BUILD=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID") + 1))
          agvtool new-version -all "$NEXT_BUILD"

      - name: Build the .ipa
        script: |
          set -e
          # Call xcodebuild directly — `xcode-project build-ipa` forces
          # CODE_SIGN_STYLE=Manual which defeats -allowProvisioningUpdates.
          # We want AUTOMATIC signing with App Store Connect API key auth so
          # Xcode fetches/creates the profile inline.
          ARCHIVE_PATH="$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive"
          IPA_PATH="$CM_BUILD_DIR/build/ios/ipa"
          KEY_PATH="$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"

          mkdir -p "$HOME/private_keys"

          # Diagnostic: print all ASC-related env vars (size + safe fingerprint)
          # and search common Codemagic locations for an existing .p8 file.
          echo "=== ASC env var diagnostics ==="
          for v in APP_STORE_CONNECT_PRIVATE_KEY APP_STORE_CONNECT_KEY_CONTENT \
                   APP_STORE_CONNECT_KEY_KEY APP_STORE_CONNECT_API_KEY_CONTENT \
                   ASC_PRIVATE_KEY APP_STORE_CONNECT_API_KEY APP_STORE_CONNECT_KEY \
                   APP_STORE_CONNECT_API_KEY_PATH; do
            val="${!v:-}"
            if [ -n "$val" ]; then
              echo "  $v: ${#val} chars; head: ${val:0:8}…${val: -8}"
            fi
          done
          echo "All ASC/APPLE-related env var NAMES (no values):"
          env | grep -iE "^(APP_STORE|APPLE|ASC|FASTLANE|XCODE|CODEMAGIC)" | cut -d= -f1 | sort
          echo ""
          echo "=== Searching for any *.p8 file on the build machine ==="
          find "$HOME" "$CM_BUILD_DIR" /tmp /Users -name "*.p8" -type f 2>/dev/null | head -20
          find "$HOME/private_keys" "$HOME/Library/MobileDevice" -type f 2>/dev/null | head -20
          echo "==============================================="

          # Resolve the ASC private key. CodeMagic stores integration-managed
          # keys as a file reference (`@file:/path/to/AuthKey_XYZ.p8`); direct
          # env vars contain the raw PEM. Handle both.
          python3 - "$KEY_PATH" <<'PY'
          import os, sys, shutil
          path = sys.argv[1]
          raw = (
              os.environ.get("APP_STORE_CONNECT_PRIVATE_KEY")
              or os.environ.get("APP_STORE_CONNECT_KEY_CONTENT")
              or ""
          ).strip()
          if not raw:
              print("ERROR: no ASC private key in env", file=sys.stderr)
              sys.exit(1)

          # Case 1: CodeMagic integration file reference.
          if raw.startswith("@file:"):
              src = raw[len("@file:"):]
              if not os.path.isfile(src):
                  print(f"ERROR: @file reference points to missing path: {src}", file=sys.stderr)
                  sys.exit(2)
              shutil.copyfile(src, path)
              os.chmod(path, 0o600)
              print(f"Copied {os.path.getsize(path)} bytes from {src} → {path}")
              sys.exit(0)

          # Case 2: raw PEM content in env var.
          if "BEGIN" in raw:
              with open(path, "w") as f:
                  f.write(raw.rstrip() + "\n")
              os.chmod(path, 0o600)
              print(f"Wrote {os.path.getsize(path)} bytes (raw PEM env)")
              sys.exit(0)

          # Case 3: base64-encoded PEM.
          import base64
          try:
              decoded = base64.b64decode(raw + "==").decode("ascii")
              if "BEGIN" in decoded:
                  with open(path, "w") as f:
                      f.write(decoded.rstrip() + "\n")
                  os.chmod(path, 0o600)
                  print(f"Wrote {os.path.getsize(path)} bytes (base64-decoded PEM)")
                  sys.exit(0)
          except Exception as e:
              print(f"ERROR: env var ({len(raw)} chars) is neither @file ref, PEM, nor base64: {e}", file=sys.stderr)
              sys.exit(3)
          print(f"ERROR: env var ({len(raw)} chars) format not recognised", file=sys.stderr)
          sys.exit(4)
          PY
          ls -la "$KEY_PATH"
          echo "First line: $(head -1 "$KEY_PATH")"

          mkdir -p "$IPA_PATH"

          # Use CodeMagic CLI tools to fetch+install signing assets via the
          # ASC API key, then build with Manual signing referencing the
          # auto-created/fetched provisioning profile. This is the documented
          # CodeMagic flow for App Store distribution.
          #
          # Why Manual (not Automatic): with CODE_SIGN_STYLE=Automatic, you
          # can't pin CODE_SIGN_IDENTITY ("conflicting provisioning settings"
          # error). And without pinning, Xcode honors the project's baked-in
          # "iPhone Developer" Release identity and looks for a development
          # profile — which doesn't exist for App Store distribution.
          #
          # `xcode-project use-profiles` patches the .xcodeproj to point at
          # the fetched .mobileprovision; from then on Manual signing has
          # everything it needs and no ASC API hand-off is required during
          # archive itself.
          #
          # CERT_KEY: an iOS Distribution cert exists in ASC but we don't
          # have its private key locally (we never had a Mac). Without one,
          # `fetch-signing-files` errors with "Cannot save Signing
          # Certificates without certificate private key". Generate a fresh
          # keypair and pass via --certificate-key (the CLI takes the PEM
          # contents inline; --certificate-key-path doesn't exist in this
          # CLI version, which is why round 4 failed with "unrecognized
          # arguments"). With --create the CLI registers a NEW Distribution
          # cert tied to this key. Apple permits multiple Distribution certs
          # per team.
          CERT_KEY_PATH="$HOME/build_cert_key.pem"
          openssl genrsa -out "$CERT_KEY_PATH" 2048
          chmod 600 "$CERT_KEY_PATH"

          # Apple's policy: ONE active Distribution cert per team. ASC
          # already has 2 (left over from earlier attempts and/or a previous
          # setup), and we have no private key for either (we never had a
          # Mac). --create therefore hits HTTP 409 "You already have a
          # current Distribution certificate or a pending certificate
          # request." Revoke them first so --create can succeed.
          #
          # Safe here: no TestFlight build has shipped yet, so revoking
          # doesn't invalidate any user-installed app.
          echo "=== app-store-connect certificates --help ==="
          app-store-connect certificates --help 2>&1 | head -40 || true
          echo "==="

          echo "=== Existing IOS_DISTRIBUTION certificates ==="
          app-store-connect certificates list --type IOS_DISTRIBUTION --json \
            > /tmp/asc-certs.json 2>&1 || echo "(list failed; continuing)"
          cat /tmp/asc-certs.json | head -40
          python3 - <<'PY' > /tmp/cert-ids.txt
          import json
          try:
              data = json.load(open("/tmp/asc-certs.json"))
              certs = data if isinstance(data, list) else data.get("data", [])
              for c in certs:
                  cid = c.get("id") if isinstance(c, dict) else None
                  if cid:
                      print(cid)
          except Exception as e:
              import sys
              print(f"(parse error: {e})", file=sys.stderr)
          PY
          while read cid; do
            [ -z "$cid" ] && continue
            echo "Revoking distribution cert $cid (no local private key)"
            app-store-connect certificates revoke "$cid" 2>&1 || \
              echo "  (revoke failed; continuing)"
          done < /tmp/cert-ids.txt

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key="@file:$CERT_KEY_PATH"
          keychain add-certificates
          xcode-project use-profiles

          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            archive \
            COMPILER_INDEX_STORE_ENABLE=NO

          # Export the archive to an .ipa for TestFlight upload
          cat > "$CM_BUILD_DIR/build/ios/exportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$IPA_PATH" \
            -exportOptionsPlist "$CM_BUILD_DIR/build/ios/exportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

    artifacts:
      - "$CM_BUILD_DIR/build/ios/ipa/*.ipa"
      - "/tmp/xcodebuild_logs/*.log"
      - "$HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app.dSYM.zip"

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - ANQR
        expire_build_submitted_for_review: true
