        - $ref: "#/components/parameters/WmTextParam"
      responses:
        "200":
          description: QR image returned successfully
          headers:
            Content-Type:
              schema:
                type: string
                enum:
                  - image/png
                  - image/gif
                  - image/webp
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: "*"
            X-ANQR-Status:
              schema:
                type: string
              description: Internal render status header when present
            X-ANQR-Cache:
              schema:
                type: string
              description: Internal cache status header when present
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid or missing request parameters
          content:
            text/plain:
              schema:
                type: string
              examples:
                missingData:
                  value: "Missing required parameter: data"
                invalidEcc:
                  value: "Invalid ec parameter"
        "403":
          description: Forbidden due to remote resource restrictions
          content:
            text/plain:
              schema:
                type: string
        "405":
          description: Method not allowed
          content:
            text/plain:
              schema:
                type: string
        "500":
          description: Unexpected rendering error
          content:
            text/plain:
              schema:
                type: string
    options:
      tags: [qr]
      summary: CORS preflight for QR generation
      description: Returns the CORS preflight response for the public QR image endpoint.
      operationId: optionsQrImage
      responses:
        "204":
          description: Preflight accepted
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: "*"
            Access-Control-Allow-Methods:
              schema:
                type: string
                example: GET, OPTIONS
            Access-Control-Allow-Headers:
              schema:
                type: string
                example: Content-Type
        "405":
          description: Method not allowed
          content:
            text/plain:
              schema:
                type: string
  /.netlify/functions/qr-render-background:
    post:
      tags: [internal]
      summary: Queue or perform a full background QR render
      description: >
        Internal Netlify background function used for long-running full overlay
        rendering. Accepts a target QR URL and performs the render in-process,
        then writes the result into blob cache.
      operationId: postQrRenderBackground
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackgroundRenderRequest"
      responses:
        "200":
          description: Background render request processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundRenderResponse"
        "400":
          description: Missing request body or url
          content:
            text/plain:
              schema:
                type: string
        "403":
          description: Target URL not allowed
          content:
            text/plain:
              schema:
                type: string
        "405":
          description: Method not allowed
          content:
            text/plain:
              schema:
                type: string
components:
  parameters:
    DataParam:
      name: data
      in: query
      required: true
      description: Content to encode in the QR symbol
      schema:
        type: string
        minLength: 1
        maxLength: 4096
        default: https://anqr.link
    FormatParam:
      name: format
      in: query
      required: false
      description: Output image format
      schema:
        type: string
        enum: [png, gif, webp, svg]
        default: gif
    SizeParam:
      name: size
      in: query
      required: false
      description: Output image size in pixels
      schema:
        type: integer
        minimum: 1
        maximum: 2048
        default: 400
    WidthParam:
      name: w
      in: query
      required: false
      description: Explicit output width in pixels
      schema:
        type: integer
        minimum: 1
        maximum: 2048
    HeightParam:
      name: h
      in: query
      required: false
      description: Explicit output height in pixels
      schema:
        type: integer
        minimum: 1
        maximum: 2048
    EccParam:
      name: ec
      in: query
      required: false
      description: Error correction level
      schema:
        type: string
        enum: [L, M, Q, H]
        default: H
    StyleParam:
      name: style
      in: query
      required: false
      description: Module drawing style
      schema:
        type: string
        enum: [square, rounded, dots, diamond, connected]
        default: square
    FgParam:
      name: fg
      in: query
      required: false
      description: Foreground color as hex without leading hash
      schema:
        type: string
        pattern: "^[0-9A-Fa-f]{6}$"
        default: "000000"
    BgParam:
      name: bg
      in: query
      required: false
      description: Background color as hex without leading hash
      schema:
        type: string
        pattern: "^[0-9A-Fa-f]{6}$"
        default: "ffffff"
    TransparentParam:
      name: transparent
      in: query
      required: false
      description: Use a transparent background when set to 1
      schema:
        type: string
        enum: ["0", "1"]
        default: "0"
    VersionParam:
      name: v
      in: query
      required: false
      description: QR version from 1 to 40, or 0 for automatic selection
      schema:
        type: integer
        minimum: 0
        maximum: 40
        default: 0
    EncodingParam:
      name: enc
      in: query
      required: false
      description: Requested QR encoding mode
      schema:
        type: string
        enum: [auto, numeric, alphanumeric, byte, kanji]
        default: auto
    ImageParam:
      name: img
      in: query
      required: false
      description: Remote image URL used as overlay source
      schema:
        type: string
        format: uri
    OverlayModeParam:
      name: mode
      in: query
      required: false
      description: Overlay rendering mode
      schema:
        type: string
        enum:
          - center
          - halftone
          - blend
          - brightness
          - mosaic
          - dithered
          - blue-noise
          - subpixel
    AnimationPatternParam:
      name: animPattern
      in: query
      required: false
      description: Animation pattern for GIF output
      schema:
        type: string
        enum:
          - none
          - pulse
          - wave
          - scanline
          - shimmer
          - drift
          - color_cycle
        default: none
    FullRenderParam:
      name: _fullRender
      in: query
      required: false
      description: Internal flag enabling full overlay render path
      schema:
        type: string
        enum: ["0", "1"]
        default: "0"
    StrictOverlayParam:
      {
        name: _strictOverlay,
        in: query,
        required: false,
        description: Internal strict overlay validation flag,
        schema: { $ref: "#/components/schemas/BinaryFlag" },
      }
    AlignParam:
      {
        name: align,
        in: query,
        required: false,
        description: Alignment pattern style,
        schema: { $ref: "#/components/schemas/AlignmentStyle" },
      }
    AnimFramesParam:
      {
        name: animFrames,
        in: query,
        required: false,
        description: Number of animation frames,
        schema: { $ref: "#/components/schemas/AnimFrames" },
      }
    AnimPattern2Param:
      {
        name: animPattern2,
        in: query,
        required: false,
        description: Secondary animation pattern,
        schema: { $ref: "#/components/schemas/AnimationPattern" },
      }
    AnimSeedParam:
      {
        name: animSeed,
        in: query,
        required: false,
        description: Primary animation seed,
        schema: { $ref: "#/components/schemas/AnyIntegerString" },
      }
    AnimSeed2Param:
      {
        name: animSeed2,
        in: query,
        required: false,
        description: Secondary animation seed,
        schema: { $ref: "#/components/schemas/AnyIntegerString" },
      }
    AnimSpeedParam:
      {
        name: animSpeed,
        in: query,
        required: false,
        description: Animation frame delay in milliseconds,
        schema: { $ref: "#/components/schemas/AnimSpeed" },
      }
    AnimTargetParam:
      {
        name: animTarget,
        in: query,
        required: false,
        description: Primary animation target,
        schema: { $ref: "#/components/schemas/AnimationTarget" },
      }
    AnimTarget2Param:
      {
        name: animTarget2,
        in: query,
        required: false,
        description: Secondary animation target,
        schema: { $ref: "#/components/schemas/AnimationTarget" },
      }
    AnimWaveAxisParam:
      {
        name: animWaveAxis,
        in: query,
        required: false,
        description: Primary wave axis,
        schema: { $ref: "#/components/schemas/AnimationWaveAxisInput" },
      }
    AnimWaveAxis2Param:
      {
        name: animWaveAxis2,
        in: query,
        required: false,
        description: Secondary wave axis,
        schema: { $ref: "#/components/schemas/AnimationWaveAxisInput" },
      }
    AutoEccParam:
      {
        name: autoEcc,
        in: query,
        required: false,
        description: Auto-pick error correction level,
        schema: { $ref: "#/components/schemas/BinaryFlag" },
      }
    AutoReduceParam:
      {
        name: autoReduce,
        in: query,
        required: false,
        description: Auto-reduce intensity until scannable,
        schema: { $ref: "#/components/schemas/BinaryFlag" },
      }
    AutoVerParam:
      {
        name: autoVer,
        in: query,
        required: false,
        description: Auto-pick QR version,
        schema: { $ref: "#/components/schemas/BinaryFlag" },
      }
    BgOverParam:
      {
        name: bgOver,
        in: query,
        required: false,
        description: Background override hex color,
        schema: { $ref: "#/components/schemas/HexColor6" },
      }
    BlendPresParam:
      {
        name: blendPres,
        in: query,
        required: false,
        description: Blend preservation toggle,
        schema: { $ref: "#/components/schemas/BinaryFlag" },
      }
    BlendPresModeParam:
      {
        name: blendPresMode,
        in: query,
        required: false,
        description: Blend preservation mode,
        schema: { enum: [overlay, dither] },
      }
    BlurParam:
      {
        name: blur,
        in: query,
        required: false,
        description: Overlay blur radius in pixels,
        schema: { $ref: "#/components/schemas/NonNegativeIntegerString" },
      }
    BnSeedParam:
      {
        name: bnSeed,
        in: query,
        required: false,
        description: Blue noise seed,
        schema: { $ref: "#/components/schemas/AnyIntegerString" },
      }
    BnTileParam:
      {
        name: bnTile,
        in: query,
        required: false,
        description: Blue noise tile size,
        schema: { $ref: "#/components/schemas/PositiveIntegerString" },
      }
    BorderParam:
      {
        name: border,
        in: query,
        required: false,
        description: Additional border modules,
        schema: { type: string, pattern: "^(0|[1-9]|10)$" },
      }
    BounceParam:
      {
        name: bounce,
        in: query,
        required: false,
        description: Bounce primary animation,
        schema: { $ref: "#/components/schemas/BinaryFlag" },
      }
    Bounce2Param:
      {
        name: bounce2,
        in: query,
        required: false,
        description: Bounce secondary animation,
        schema: { $ref: "#/components/schemas/BinaryFlag" },
      }
    BrightnessParam:
      {
        name: brightness,
        in: query,
        required: false,
        description: Overlay brightness adjustment,
        schema: { $ref: "#/components/schemas/SignedPercentString" },
      }
    CGuardParam:
      {
        name: cGuard,
        in: query,
        required: false,
        description: Per-module contrast guard toggle,
        schema: { $ref: "#/components/schemas/BinaryFlag" },
      }
    CharsetParam:
      {
        name: charset,
        in: query,
        required: false,
        description: Character set hint,
        schema: { enum: [default, utf8, shift-jis] },
      }
    ColorCycleParam:
      {
        name: colorCycle,
        in: query,
        required: false,
        description: Primary color cycle toggle,
        schema: { $ref: "#/components/schemas/BinaryFlag" },
      }
    ColorCycle2Param:
      {
        name: colorCycle2,
        in: query,
        required: false,
        description: Secondary color cycle toggle,
        schema: { $ref: "#/components/schemas/BinaryFlag" },
      }
    ColorDitherParam:
      {
        name: colorDither,
        in: query,
        required: false,
        description: Color dithering mode,
        schema: { enum: [none, per_channel, perceptual] },
      }
    ColorModeParam:
      {
        name: colorMode,
        in: query,
        required: false,
        description: Overlay color mode,
        schema: { $ref: "#/components/schemas/ColorMode" },
      }
    ContrastParam:
      {
        name: contrast,
        in: query,
        required: false,
        description: Overlay contrast adjustment,
        schema: { $ref: "#/components/schemas/SignedPercentString" },
      }
    CrispParam:
      {
        name: crisp,
        in: query,
        required: false,
        description: Crisp pixel-edge rendering toggle,
        schema: { $ref: "#/components/schemas/BinaryFlag" },
      }
    CropEnParam:
      {
        name: cropEn,
        in: query,
        required: false,
        description: Enable overlay cropping,
        schema: { $ref: "#/components/schemas/BinaryFlag" },
      }
    CropSizeParam:
      {
        name: cropSize,
        in: query,
        required: false,
        description: Crop size fraction,
        schema: { $ref: "#/components/schemas/FractionString" },
      }
    CropXParam:
      {
        name: cropX,
        in: query,
        required: false,
        description: Crop center X,
        schema: { $ref: "#/components/schemas/FractionString" },
      }
    CropYParam:
      {
        name: cropY,
        in: query,
        required: false,
        description: Crop center Y,
        schema: { $ref: "#/components/schemas/FractionString" },
      }
    DiffusionKernelParam:
      {
        name: diffusionKernel,
