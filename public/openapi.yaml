        required: false,
        description: SVG shape precision mode,
        schema: { $ref: "#/components/schemas/SvgPrecision" },
      }
    SvgVecParam:
      {
        name: svgVec,
        in: query,
        required: false,
        description: Force true-vector SVG export path,
        schema: { type: string, enum: ["0", "1"] },
      }
    TempDitherParam:
      {
        name: tempDither,
        in: query,
        required: false,
        description: Temporal dithering mode,
        schema: { $ref: "#/components/schemas/AnimationTemporalDitherMode" },
      }
    ThresholdParam:
      {
        name: threshold,
        in: query,
        required: false,
        description: Overlay threshold level,
        schema: { type: string, pattern: "^([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])$" },
      }
    TimingParam:
      {
        name: timing,
        in: query,
        required: false,
        description: Timing pattern style,
        schema: { $ref: "#/components/schemas/TimingStyle" },
      }
    WebpQParam:
      {
        name: webpQ,
        in: query,
        required: false,
        description: WebP quality,
        schema: { $ref: "#/components/schemas/Percent0To100String" },
      }
    WmBlendParam:
      {
        name: wmBlend,
        in: query,
        required: false,
        description: Watermark blend mode,
        schema: { $ref: "#/components/schemas/WatermarkBlend" },
      }
    WmEnParam:
      {
        name: wmEn,
        in: query,
        required: false,
        description: Enable watermark,
        schema: { type: string, enum: ["0", "1"] },
      }
    WmImgParam:
      {
        name: wmImg,
        in: query,
        required: false,
        description: Watermark image URL,
        schema: { type: string, format: uri },
      }
    WmKindParam:
      {
        name: wmKind,
        in: query,
        required: false,
        description: Watermark kind,
        schema: { $ref: "#/components/schemas/WatermarkKind" },
      }
    WmOpacityParam:
      {
        name: wmOpacity,
        in: query,
        required: false,
        description: Watermark opacity percentage,
        schema: { $ref: "#/components/schemas/Percent0To100String" },
      }
    WmPosParam:
      {
        name: wmPos,
        in: query,
        required: false,
        description: Watermark position,
        schema: { $ref: "#/components/schemas/WatermarkPosition" },
      }
    WmTextParam:
      {
        name: wmText,
        in: query,
        required: false,
        description: Watermark text,
        schema: { type: string },
      }
  schemas:
    BinaryFlag:
      type: string
      enum: ["0", "1"]
    HexColor6:
      type: string
      pattern: "^[0-9A-Fa-f]{6}$"
    AnyIntegerString:
      type: string
      pattern: "^-?[0-9]+$"
    NonNegativeIntegerString:
      type: string
      pattern: "^(0|[1-9][0-9]*)$"
    PositiveIntegerString:
      type: string
      pattern: "^[1-9][0-9]*$"
    Percent0To100String:
      type: string
      pattern: "^(100|[1-9]?[0-9])$"
    SignedPercentString:
      type: string
      pattern: "^-?(100|[1-9]?[0-9])$"
    FractionString:
      type: string
      pattern: '^(0(\.[0-9]+)?|1(\.0+)?)$'
    AngleString:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
    GammaString:
      type: string
      pattern: '^(0\.[1-9][0-9]*|[12](\.[0-9]+)?|3(\.0+)?)$'
    ContrastRatioString:
      type: string
      pattern: '^([1-9](\.[0-9]+)?|1[0-9](\.[0-9]+)?|20(\.0+)?|21(\.0+)?)$'
    AnimFrames:
      type: string
      pattern: "^([1-9]|[1-5][0-9]|60)$"
    AnimSpeed:
      type: string
      pattern: "^([1-9][0-9]{1,2}|1000)$"
    GifColors:
      type: string
      pattern: "^([2-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-6])$"
    AlignmentStyle:
      type: string
      enum: [match_finder, square, rounded, circle]
    FinderStyle:
      type: string
      enum: [square, rounded, circle]
    TimingStyle:
      type: string
      enum: [match_module, solid, dashed]
    AnimationPattern:
      type: string
      enum: [none, pulse, wave, scanline, shimmer, drift, color_cycle]
    AnimationEasing:
      type: string
      enum: [linear, ease_in, ease_out, ease_in_out, bounce]
    AnimationTarget:
      type: string
      enum: [result, modules, both]
    AnimationWaveAxisInput:
      type: string
      enum: [x, y, xy]
    AnimationInterpolation:
      type: string
      enum: [none, crossfade, morph]
    AnimationTemporalDitherMode:
      type: string
      enum: [off, blue_noise, flicker_safe]
    ColorMode:
      type: string
      enum: [bw, grayscale, color]
    DitherKind:
      type: string
      enum:
        - none
        - error_diffusion
        - floyd_steinberg
        - atkinson
        - sierra
        - stucki
        - burkes
        - ordered_bayer
        - ordered_clustered
        - ordered_void_cluster
        - blue_noise
        - blue_noise_threshold
        - blue_noise_error_diffusion
        - screened_blue_noise
        - white_noise
        - gaussian_noise
        - triangular_noise
        - perceptual
        - edge_aware
        - adaptive_threshold
        - temporal_blue_noise
        - true_dither
    OrderedMatrix:
      type: string
      enum: [bayer2, bayer4, bayer8, clustered_dot, void_cluster]
    GapMode:
      type: string
      enum: [none, inset, stroke, negative_space]
    GradientType:
      type: string
      enum: [none, linear, radial, conic]
    HalftoneCellMode:
      type: string
      enum: [per_module, 2x2, 3x3, 4x4]
    HalftoneCurve:
      type: string
      enum: [linear, s-curve, gamma]
    HalftoneDotShape:
      type: string
      enum: [circle, square, line]
    FormatExtra:
      type: string
      enum: [none, eps, animated_webp]
    FrameStyle:
      type: string
      enum: [none, rounded_frame, sticker, tag]
    PerModuleColorMode:
      type: string
      enum: [solid, by_brightness, by_position, by_overlay, by_cluster]
    GradientStops:
      type: string
      pattern: '^([0-9A-Fa-f]{6},(0(\.[0-9]+)?|1(\.0+)?))(,[0-9A-Fa-f]{6},(0(\.[0-9]+)?|1(\.0+)?))*$'
    HexColorPalette:
      type: string
      pattern: "^[0-9A-Fa-f]{6}(,[0-9A-Fa-f]{6})*$"
    LanguageTag:
      type: string
      pattern: "^[A-Za-z]{2,3}(-[A-Za-z0-9]{2,8})*$"
    OverlayFramePick:
      type: string
      enum: [all, every_n, max_frames, duration_limit]
    OverlayType:
      type: string
      enum: [static, gif, apng, webp_anim, video]
    PaletteMode:
      type: string
      enum: [position, brightness, diagonal, radial, random, row, column]
    PixelSnapMode:
      type: string
      enum: [floor, round, ceil]
    SafetyMode:
      type: string
      enum: [off, balanced, strict]
    SubpixelCenterRule:
      type: string
      enum: [strict, halftone_center]
    SubpixelFinderOverride:
      type: string
      enum: [solid, stylized]
    SubpixelGridSize:
      type: string
      enum: [2x2, 3x3, 4x4]
    SvgPrecision:
      type: string
      enum: [pixel, precise]
    WatermarkBlend:
      type: string
      enum: [normal, multiply, screen, overlay, soft-light]
    WatermarkKind:
      type: string
      enum: [text, image, pattern]
    WatermarkPosition:
      type: string
      enum: [center, corners, edges, behind, quiet_zone]
    GifDisposal:
      oneOf:
        - type: string
          enum: [none, keep, restore_previous, restore_background]
        - type: string
          pattern: "^[0-3]$"
    MaskPatternInput:
      oneOf:
        - type: string
          enum: [auto]
        - type: string
          pattern: "^[0-7]$"
    BackgroundRenderRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Fully qualified ANQR QR render URL to execute
    BackgroundRenderResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [complete, error]
        httpStatus:
          type: integer
          minimum: 100
          maximum: 599
        bodySize:
          type: integer
          minimum: 0
        message:
          type: string
