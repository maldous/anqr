openapi: 3.1.0
info:
  title: ANQR API
  version: 1.0.69
  summary: Public QR rendering API and internal background render endpoint
  description: >
    Contract for the ANQR Netlify API surface. The public API is `/api/qr`,
    which generates QR images in PNG, GIF, or WebP. The background endpoint
    `/.netlify/functions/qr-render-background` is an internal asynchronous
    render helper used for long-running full overlay generation.
  contact:
    name: ANQR
    url: https://anqr.link
  license:
    name: ISC
    identifier: ISC
servers:
  - url: https://anqr.link
    description: Production
  - url: http://127.0.0.1:8888
    description: Local Netlify Dev
security: []
tags:
  - name: qr
    description: Public QR image generation
  - name: internal
    description: Internal asynchronous rendering support
paths:
  /api/qr:
    get:
      tags: [qr]
      summary: Generate a QR image
      description: >
        Generates a QR code image from query parameters. The default output
        format is GIF. PNG and WebP are also supported. Some advanced
        parameters are accepted for styling, overlays, animation, and output
        control.
      operationId: getQrImage
      parameters:
        - $ref: "#/components/parameters/DataParam"
        - $ref: "#/components/parameters/FormatParam"
        - $ref: "#/components/parameters/SizeParam"
        - $ref: "#/components/parameters/WidthParam"
