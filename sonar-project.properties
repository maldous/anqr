sonar.projectKey=anqr
sonar.projectName=ANQR - Animated QR Code Generator
sonar.host.url=http://localhost:9000
sonar.projectVersion=1.0
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

sonar.sources=src,netlify,scripts,services,apps,packages
sonar.typescript.file.suffixes=.ts,.tsx
sonar.typescript.tsconfigPath=tsconfig.json
sonar.javascript.file.suffixes=.js,.jsx,.mjs
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx
sonar.tests=tests

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/__mocks__/**,\
  **/i18n/locales/**,\
  **/i18n/static/**,\
  **/src/content/generated/**,\
  **/*.min.js

sonar.cpd.exclusions=\
  **/i18n/**,\
  **/*.json,\
  **/gallery-showcase.generated.ts

sonar.coverage.exclusions=\
  **/*.d.ts,\
  **/i18n/**,\
  **/src/content/generated/**
