# =============================================================================
# SonarQube Configuration for ANQR
# =============================================================================
# Run analysis with: make sonar
# View results at: http://localhost:9000/dashboard?id=anqr

# -----------------------------------------------------------------------------
# Project Identification
# -----------------------------------------------------------------------------
sonar.projectKey=anqr
sonar.projectName=ANQR - Animated QR Code Generator
sonar.projectVersion=1.0

# -----------------------------------------------------------------------------
# Server Configuration
# -----------------------------------------------------------------------------
sonar.host.url=http://localhost:9000
sonar.token=sqa_d92be6588fb7576a7de0014b7ddc05911d9afc6b

# -----------------------------------------------------------------------------
# Source Configuration
# -----------------------------------------------------------------------------
sonar.sources=src,netlify
sonar.sourceEncoding=UTF-8

# TypeScript/JavaScript specific
sonar.javascript.file.suffixes=.js,.jsx,.mjs
sonar.typescript.file.suffixes=.ts,.tsx

# -----------------------------------------------------------------------------
# Exclusions
# -----------------------------------------------------------------------------
# Files/folders to exclude from analysis
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/android/**,\
  **/*.test.ts,\
  **/*.spec.ts,\
  **/*.test.tsx,\
  **/*.spec.tsx,\
  **/coverage/**,\
  **/__mocks__/**,\
  **/__tests__/**,\
  **/i18n/locales/*.json,\
  **/i18n/locales/txt/**,\
  **/i18n/static/**/txt/**,\
  **/i18n/static/txt/**,\
  **/qrcode.mjs

# Files to exclude from duplication detection
sonar.cpd.exclusions=\
  **/i18n/**,\
  **/*.json,\
  **/gallery-items.ts,\
  **/gallery-showcase.generated.ts

# Files to exclude from coverage analysis
# Keep this list narrow so Sonar reflects real product-code coverage.
# Only declarations, entrypoints, static i18n content, and explicitly
# non-unit-testable runtime shims stay excluded.
sonar.coverage.exclusions=\
  **/i18n/**,\
  **/*.d.ts,\
  **/types/**,\
  **/main.tsx,\
  **/data/**,\
  **/App.tsx,\
  **/edge-functions/**

# -----------------------------------------------------------------------------
# Test Configuration
# -----------------------------------------------------------------------------
sonar.tests=tests
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx

# Coverage report (if using vitest/jest with lcov)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# -----------------------------------------------------------------------------
# Analysis Parameters
# -----------------------------------------------------------------------------
# Fail the build if quality gate is not met (for CI)
# sonar.qualitygate.wait=true

# -----------------------------------------------------------------------------
# Rule Suppressions — style preferences only
# -----------------------------------------------------------------------------
# Only genuinely subjective style choices are suppressed here.
# Real quality issues (deprecated APIs, ARIA, empty catches, cognitive
# complexity, identical functions, etc.) are left visible so the dashboard
# reflects the true state of the codebase.

sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14,e15,e16,e17,e18,e19,e20,e21,e22

# TODO comments — informational, not a quality issue
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1135
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*

# Cognitive complexity in transpiled qr-generator.js (not hand-written)
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.e2.resourceKey=**/qr-generator.js

# Max lines per function in payload generators (many payment-type branches)
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S138
sonar.issue.ignore.multicriteria.e3.resourceKey=**/payload-generators.ts

# Too many parameters — QR/animation pipeline passes many args by design
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S107
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*

# Nested ternary — common JSX conditional rendering pattern
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S3358
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*

# Cognitive complexity in Python i18n utility scripts
sonar.issue.ignore.multicriteria.e6.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.e6.resourceKey=**/i18n/**

# Type alias vs interface — pure style choice, TS supports both equally
sonar.issue.ignore.multicriteria.e7.ruleKey=typescript:S4323
sonar.issue.ignore.multicriteria.e7.resourceKey=**/*

# Nested functions — idiomatic in React hooks and closures
sonar.issue.ignore.multicriteria.e8.ruleKey=typescript:S2004
sonar.issue.ignore.multicriteria.e8.resourceKey=**/*

# useEffect merging — separate effects are a deliberate React design choice
sonar.issue.ignore.multicriteria.e9.ruleKey=typescript:S6759
sonar.issue.ignore.multicriteria.e9.resourceKey=**/*

# Boolean parameters — legitimate in utility/algorithm APIs
sonar.issue.ignore.multicriteria.e10.ruleKey=typescript:S2301
sonar.issue.ignore.multicriteria.e10.resourceKey=**/*

# RegExp.exec() vs String.match() — style preference
sonar.issue.ignore.multicriteria.e11.ruleKey=typescript:S6594
sonar.issue.ignore.multicriteria.e11.resourceKey=**/*

# Multiple Array#push() calls — style preference
sonar.issue.ignore.multicriteria.e12.ruleKey=typescript:S7778
sonar.issue.ignore.multicriteria.e12.resourceKey=**/*

# for…of vs .forEach() — style preference
sonar.issue.ignore.multicriteria.e13.ruleKey=typescript:S7728
sonar.issue.ignore.multicriteria.e13.resourceKey=**/*

# globalThis vs window — browser-only code intentionally uses window
sonar.issue.ignore.multicriteria.e14.ruleKey=typescript:S7764
sonar.issue.ignore.multicriteria.e14.resourceKey=**/*

# String literal in union type — intentional for IDE autocomplete
sonar.issue.ignore.multicriteria.e15.ruleKey=typescript:S6571
sonar.issue.ignore.multicriteria.e15.resourceKey=**/*

# Top-level await — not compatible with all bundler/module configurations
sonar.issue.ignore.multicriteria.e16.ruleKey=typescript:S7785
sonar.issue.ignore.multicriteria.e16.resourceKey=**/*

# Array vs Set for includes — small arrays are fine
sonar.issue.ignore.multicriteria.e17.ruleKey=typescript:S7776
sonar.issue.ignore.multicriteria.e17.resourceKey=**/*

# String.raw for regex — style preference (618 instances, purely cosmetic)
sonar.issue.ignore.multicriteria.e18.ruleKey=typescript:S7780
sonar.issue.ignore.multicriteria.e18.resourceKey=**/*

# Type assertions — canvas.getContext() and non-null assertions are project convention
sonar.issue.ignore.multicriteria.e19.ruleKey=typescript:S4325
sonar.issue.ignore.multicriteria.e19.resourceKey=**/*

# for-of vs indexed loop — index often needed for parallel array access
sonar.issue.ignore.multicriteria.e20.ruleKey=typescript:S4138
sonar.issue.ignore.multicriteria.e20.resourceKey=**/*

# Negated conditions — intentional pattern for building sparse config objects
sonar.issue.ignore.multicriteria.e21.ruleKey=typescript:S7735
sonar.issue.ignore.multicriteria.e21.resourceKey=**/*

# Complex regex in i18n placeholder protection — intentionally thorough
sonar.issue.ignore.multicriteria.e22.ruleKey=python:S5843
sonar.issue.ignore.multicriteria.e22.resourceKey=**/i18n/**

# -----------------------------------------------------------------------------
# Language-Specific Settings
# -----------------------------------------------------------------------------
# TypeScript parser configuration
sonar.typescript.tsconfigPath=tsconfig.sonar.json

# Python version (for precise analysis of i18n utility scripts)
sonar.python.version=3.12

# React/JSX support is automatic with SonarQube

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
# Verbose output for debugging (uncomment if needed)
# sonar.verbose=true
# sonar.log.level=DEBUG

# -----------------------------------------------------------------------------
# Python Configuration
# -----------------------------------------------------------------------------
# i18n utility scripts are Python 3.12; no external linter reports.
# sonar.python.pylint.reportPaths=
# sonar.python.bandit.reportPaths=
