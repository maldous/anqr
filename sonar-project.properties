sonar.projectKey=anqr
sonar.projectName=ANQR - Animated QR Code Generator
sonar.host.url=http://localhost:9000
sonar.projectVersion=1.0
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

sonar.sources=src,netlify,harness/ops,apps,packages
sonar.typescript.file.suffixes=.ts,.tsx
sonar.typescript.tsconfigPath=tsconfig.json
sonar.javascript.file.suffixes=.js,.jsx,.mjs
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx
sonar.tests=tests

sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/__mocks__/**,\
  android/**,\
  apps/android/**,\
  apps/web/src/i18n/locales/**,\
  apps/web/src/i18n/static/**,\
  **/i18n/locales/**,\
  **/i18n/static/**,\
  **/src/content/generated/**,\
  **/*.min.js

sonar.cpd.exclusions=\
 apps/web/src/i18n/**,\
 apps/web/src/content/gallery/**,\
 packages/contracts/**,\
 packages/domain/qr/src/qr-generator/types/render-modules-options.ts,\
 packages/domain/qr/src/generator-types/qr-generator-config.ts,\
 packages/domain/render/src/qr-generator-shared/config.types.ts,\
 **/i18n/**,\
 **/*.json,\
 **/gallery-showcase.generated.ts

sonar.coverage.exclusions=\
  **/*.d.ts,\
  apps/web/src/i18n/**,\
  **/i18n/**,\
  **/src/content/generated/**

sonar.issue.ignore.multicriteria=e1,e2,e3
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*
sonar.issue.ignore.multicriteria.e3.ruleKey=javascript:S3776
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*
