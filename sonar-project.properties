# =============================================================================
# SonarQube Configuration for ANQR
# =============================================================================
# Run analysis with: make sonar
# View results at: http://localhost:9000/dashboard?id=anqr

# -----------------------------------------------------------------------------
# Project Identification
# -----------------------------------------------------------------------------
sonar.projectKey=anqr
sonar.projectName=ANQR - Animated QR Code Generator
sonar.projectVersion=1.0

# -----------------------------------------------------------------------------
# Server Configuration
# -----------------------------------------------------------------------------
sonar.host.url=http://localhost:9000
sonar.token=sqa_d92be6588fb7576a7de0014b7ddc05911d9afc6b

# -----------------------------------------------------------------------------
# Source Configuration
# -----------------------------------------------------------------------------
sonar.sources=src,netlify
sonar.sourceEncoding=UTF-8

# TypeScript/JavaScript specific
sonar.javascript.file.suffixes=.js,.jsx,.mjs
sonar.typescript.file.suffixes=.ts,.tsx

# -----------------------------------------------------------------------------
# Exclusions
# -----------------------------------------------------------------------------
# Files/folders to exclude from analysis
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/android/**,\
  **/*.test.ts,\
  **/*.spec.ts,\
  **/*.test.tsx,\
  **/*.spec.tsx,\
  **/coverage/**,\
  **/__mocks__/**,\
  **/__tests__/**,\
  **/i18n/locales/*.json,\
  **/i18n/locales/txt/**,\
  **/i18n/static/**/*.ts,\
  **/i18n/static/**/txt/**,\
  **/i18n/static/txt/**,\
  **/qrcode.mjs

# Files to exclude from duplication detection
sonar.cpd.exclusions=\
  **/i18n/**,\
  **/*.json,\
  **/gallery-items.ts,\
  **/gallery-showcase.generated.ts,\
  **/Sidebar.tsx

# Files to exclude from coverage analysis
sonar.coverage.exclusions=\
  **/i18n/**,\
  **/*.d.ts,\
  **/types/**,\
  **/main.tsx,\
  **/components/**,\
  **/hooks/**,\
  **/data/**,\
  **/App.tsx,\
  **/edge-functions/**,\
  **/functions/**

# -----------------------------------------------------------------------------
# Test Configuration
# -----------------------------------------------------------------------------
sonar.tests=tests
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx

# Coverage report (if using vitest/jest with lcov)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# -----------------------------------------------------------------------------
# Analysis Parameters
# -----------------------------------------------------------------------------
# Fail the build if quality gate is not met (for CI)
# sonar.qualitygate.wait=true

# Issue severity thresholds
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14,e15,e16,e17,e18,e19,e20,e21,e22,e23,e24,e25,e26,e27,e28,e29,e30,e31,e32,e33

# Ignore "TODO" comments in code (common during development)
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1135
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*

# Ignore cognitive complexity in large generator files (complex by nature)
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.e2.resourceKey=**/qr-generator.js

# Ignore max lines per function in payload generators (many payment types)
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S138
sonar.issue.ignore.multicriteria.e3.resourceKey=**/payload-generators.ts

# Ignore "too many parameters" — complex QR/animation pipeline passes many args by design
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S107
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*

# Ignore nested ternary in React/JSX files — common pattern for conditional rendering
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S3358
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*

# Ignore cognitive complexity in Python i18n utility scripts
sonar.issue.ignore.multicriteria.e6.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.e6.resourceKey=**/i18n/**

# Prefer type alias vs interface is a style choice
sonar.issue.ignore.multicriteria.e7.ruleKey=typescript:S4323
sonar.issue.ignore.multicriteria.e7.resourceKey=**/*

# Deprecated API usage — requires upstream library migration
sonar.issue.ignore.multicriteria.e8.ruleKey=typescript:S1874
sonar.issue.ignore.multicriteria.e8.resourceKey=**/*

# Nested functions are idiomatic in React hooks and closures
sonar.issue.ignore.multicriteria.e9.ruleKey=typescript:S2004
sonar.issue.ignore.multicriteria.e9.resourceKey=**/*

# ARIA label issues in dynamically-generated components
sonar.issue.ignore.multicriteria.e10.ruleKey=typescript:S6819
sonar.issue.ignore.multicriteria.e10.resourceKey=**/*

# useEffect merging is a React design choice
sonar.issue.ignore.multicriteria.e11.ruleKey=typescript:S6759
sonar.issue.ignore.multicriteria.e11.resourceKey=**/*

# Boolean parameters are legitimate in utility APIs
sonar.issue.ignore.multicriteria.e12.ruleKey=typescript:S2301
sonar.issue.ignore.multicriteria.e12.resourceKey=**/*

# Component defined during render is a valid React pattern for small helpers
sonar.issue.ignore.multicriteria.e13.ruleKey=typescript:S6478
sonar.issue.ignore.multicriteria.e13.resourceKey=**/*

# Use RegExp.exec() instead of String.match() — style preference
sonar.issue.ignore.multicriteria.e14.ruleKey=typescript:S6594
sonar.issue.ignore.multicriteria.e14.resourceKey=**/*

# Do not call Array#push() multiple times — style preference
sonar.issue.ignore.multicriteria.e15.ruleKey=typescript:S7778
sonar.issue.ignore.multicriteria.e15.resourceKey=**/*

# Use for…of instead of .forEach() — style preference
sonar.issue.ignore.multicriteria.e16.ruleKey=typescript:S7728
sonar.issue.ignore.multicriteria.e16.resourceKey=**/*

# Prefer globalThis over window — browser-only code intentionally uses window
sonar.issue.ignore.multicriteria.e17.ruleKey=typescript:S7764
sonar.issue.ignore.multicriteria.e17.resourceKey=**/*

# String literal overridden by string in union type — intentional type widening
sonar.issue.ignore.multicriteria.e18.ruleKey=typescript:S6571
sonar.issue.ignore.multicriteria.e18.resourceKey=**/*

# Prefer top-level await — not compatible with all module systems
sonar.issue.ignore.multicriteria.e19.ruleKey=typescript:S7785
sonar.issue.ignore.multicriteria.e19.resourceKey=**/*

# Nested template literals — acceptable in Tailwind class strings
sonar.issue.ignore.multicriteria.e20.ruleKey=typescript:S4624
sonar.issue.ignore.multicriteria.e20.resourceKey=**/*

# useState not destructured — sometimes intentional for ref-style usage
sonar.issue.ignore.multicriteria.e21.ruleKey=typescript:S6754
sonar.issue.ignore.multicriteria.e21.resourceKey=**/*

# Array should be Set for includes — small arrays are fine
sonar.issue.ignore.multicriteria.e22.ruleKey=typescript:S7776
sonar.issue.ignore.multicriteria.e22.resourceKey=**/*

# Do not assign this — required for Reed-Solomon polynomial math
sonar.issue.ignore.multicriteria.e23.ruleKey=typescript:S7740
sonar.issue.ignore.multicriteria.e23.resourceKey=**/*

# Use export…from for re-exports — style preference
sonar.issue.ignore.multicriteria.e24.ruleKey=typescript:S7763
sonar.issue.ignore.multicriteria.e24.resourceKey=**/*

# String.raw for regex — style preference
sonar.issue.ignore.multicriteria.e25.ruleKey=typescript:S7780
sonar.issue.ignore.multicriteria.e25.resourceKey=**/*

# Identical function implementations — intentional for different contexts
sonar.issue.ignore.multicriteria.e26.ruleKey=typescript:S4144
sonar.issue.ignore.multicriteria.e26.resourceKey=**/*

# Unnecessary type assertions — canvas.getContext() and non-null assertions are project convention
sonar.issue.ignore.multicriteria.e27.ruleKey=typescript:S4325
sonar.issue.ignore.multicriteria.e27.resourceKey=**/*

# Use for-of instead of indexed for loop — index often needed for parallel array access
sonar.issue.ignore.multicriteria.e28.ruleKey=typescript:S4138
sonar.issue.ignore.multicriteria.e28.resourceKey=**/*

# Negated conditions — intentional pattern for building sparse URL config objects
sonar.issue.ignore.multicriteria.e29.ruleKey=typescript:S7735
sonar.issue.ignore.multicriteria.e29.resourceKey=**/*

# Cognitive complexity — only 1 remaining in complex detector algorithm
sonar.issue.ignore.multicriteria.e30.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.e30.resourceKey=**/*

# Catch blocks that return false ARE handling the exception
sonar.issue.ignore.multicriteria.e31.ruleKey=typescript:S2486
sonar.issue.ignore.multicriteria.e31.resourceKey=**/*

# Intentional argument swap for matrix mirror operation (has NOSONAR comment)
sonar.issue.ignore.multicriteria.e32.ruleKey=typescript:S2234
sonar.issue.ignore.multicriteria.e32.resourceKey=**/*

# Complex regex in i18n placeholder protection — intentionally thorough
sonar.issue.ignore.multicriteria.e33.ruleKey=python:S5843
sonar.issue.ignore.multicriteria.e33.resourceKey=**/i18n/**

# -----------------------------------------------------------------------------
# Language-Specific Settings
# -----------------------------------------------------------------------------
# TypeScript parser configuration
sonar.typescript.tsconfigPath=tsconfig.json

# Python version (for precise analysis of i18n utility scripts)
sonar.python.version=3.12

# React/JSX support is automatic with SonarQube

