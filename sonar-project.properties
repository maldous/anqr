# =============================================================================
# SonarQube Configuration for ANQR
# =============================================================================
# Run analysis with: make sonar
# View results at: http://localhost:9000/dashboard?id=anqr

# -----------------------------------------------------------------------------
# Project Identification
# -----------------------------------------------------------------------------
sonar.projectKey=anqr
sonar.projectName=ANQR - Animated QR Code Generator
sonar.projectVersion=1.0

# -----------------------------------------------------------------------------
# Server Configuration
# -----------------------------------------------------------------------------
sonar.host.url=http://localhost:9000

# -----------------------------------------------------------------------------
# Source Configuration
# -----------------------------------------------------------------------------
sonar.sources=src,netlify,android/app/src/main,ios/App/App,scripts
sonar.sourceEncoding=UTF-8

# TypeScript/JavaScript specific
sonar.javascript.file.suffixes=.js,.jsx,.mjs
sonar.typescript.file.suffixes=.ts,.tsx

# -----------------------------------------------------------------------------
# Exclusions
# -----------------------------------------------------------------------------
# Files/folders to exclude from analysis
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/*.test.ts,\
  **/*.spec.ts,\
  **/*.test.tsx,\
  **/*.spec.tsx,\
  **/androidTest/**,\
  **/src/test/**,\
  **/coverage/**,\
  **/__mocks__/**,\
  **/__tests__/**,\
  **/i18n/locales/*.json,\
  **/i18n/locales/txt/**,\
  **/i18n/static/**/txt/**,\
  **/i18n/static/txt/**,\
  **/*.png,\
  **/*.jpg,\
  **/*.jpeg,\
  **/*.gif,\
  **/*.webp,\
  **/*.keystore,\
  **/project.pbxproj,\
  **/Gemfile.lock,\
  **/qrcode.mjs

# Files to exclude from duplication detection
sonar.cpd.exclusions=\
  **/*.json,\
  **/gallery-showcase.generated.ts,\
  **/i18n/locales/*.json,\
  **/i18n/locales/txt/**,\
  **/i18n/static/**/txt/**,\
  **/i18n/static/txt/**

# Files to exclude from coverage analysis
# Keep this list narrow so Sonar reflects real product-code coverage.
# Only declarations, entrypoints, static i18n content, and explicitly
# non-unit-testable runtime shims stay excluded.
sonar.coverage.exclusions=\
  **/*.d.ts,\
  **/main.tsx,\
  **/i18n/locales/*.json,\
  **/i18n/locales/txt/**,\
  **/i18n/static/**/txt/**,\
  **/i18n/static/txt/**,\
  **/gallery-showcase.generated.ts

# -----------------------------------------------------------------------------
# Test Configuration
# -----------------------------------------------------------------------------
sonar.tests=tests,src,android/app/src/test,android/app/src/androidTest
sonar.test.inclusions=tests/**/*,src/**/*.test.ts,src/**/*.spec.ts,src/**/*.test.tsx,src/**/*.spec.tsx,android/app/src/test/**/*.java,android/app/src/androidTest/**/*.java

# Coverage report (if using vitest/jest with lcov)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# -----------------------------------------------------------------------------
# Analysis Parameters
# -----------------------------------------------------------------------------
# Fail the build if quality gate is not met (for CI)
# sonar.qualitygate.wait=true

# -----------------------------------------------------------------------------
# Language-Specific Settings
# -----------------------------------------------------------------------------
# Java parser configuration for Android native sources
sonar.java.binaries=android/app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes
sonar.java.test.binaries=android/app/build/intermediates/javac/debugUnitTest/compileDebugUnitTestJavaWithJavac/classes

# TypeScript parser configuration
sonar.typescript.tsconfigPath=tsconfig.sonar.json

# Python version (for precise analysis of i18n utility scripts)
sonar.python.version=3.12

# React/JSX support is automatic with SonarQube

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
# Verbose output for debugging (uncomment if needed)
# sonar.verbose=true
# sonar.log.level=DEBUG

# -----------------------------------------------------------------------------
# Python Configuration
# -----------------------------------------------------------------------------
# i18n utility scripts are Python 3.12; no external linter reports.
# sonar.python.pylint.reportPaths=
# sonar.python.bandit.reportPaths=
